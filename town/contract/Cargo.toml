[package]
name = "agentproof_anchor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Write-once anchor for AgentProof receipt digests on NEAR testnet. No dependencies."

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = true
